[package]
name = "tachiko-control-tower"
version = "0.1.0"
description = "A macOS-first operational projection for Tachiko Conductor"
authors = ["nurockplayer"]
edition = "2021"

[lib]
name = "tachiko_control_tower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9", features = ["tray-icon"] }
