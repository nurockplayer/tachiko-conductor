name: Issue 104 uninstrumented ordinary browser verification
on:
  push:
    branches: [qualification/issue104-stage6-browser]
permissions:
  contents: read
concurrency:
  group: issue104-stage6-browser
  cancel-in-progress: false
jobs:
  observe:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 98ca7b4685226f459d31dfd792aef27edb1d44e8
      CANDIDATE_TREE: 957e53f59350ddff4594f07c9758f572a006d841
    steps:
      - uses: actions/checkout@v7
        with:
          path: infrastructure
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 98ca7b4685226f459d31dfd792aef27edb1d44e8
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: candidate/.node-version
      - name: Prove pinned tools and owned host bounds
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/xcode-select --switch /Library/Developer/CommandLineTools
          printf '/Library/Developer/CommandLineTools/usr/bin\n' >> "$GITHUB_PATH"
          export PATH="/Library/Developer/CommandLineTools/usr/bin:$PATH"
          /usr/bin/sw_vers
          /usr/bin/uname -m
          /usr/sbin/sysctl -n hw.logicalcpu hw.memsize
          /bin/df -k "$RUNNER_TEMP"
          for program in /usr/bin/git /Library/Developer/CommandLineTools/usr/bin/git "$(command -v git)"; do
            exec_path=$(env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 "$program" --exec-path)
            canonical=$(node -e 'console.log(require("fs").realpathSync(process.argv[1]))' "$exec_path")
            test "$canonical" = /Library/Developer/CommandLineTools/usr/libexec/git-core
            printf 'qualified-git=%s exec-path=%s\n' "$program" "$canonical"
          done
          test "$(node --version)" = v24.21.0
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          test "$(pnpm --version)" = 10.34.5
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git -C candidate switch --create ci-browser-verification
          qual_root=$(mktemp -d /private/tmp/bd-XXXXXX)
          chmod 700 "$qual_root"
          mkdir -m 700 "$qual_root/store" "$qual_root/browsers"
          printf 'QUAL_ROOT=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$qual_root" "$qual_root" >> "$GITHUB_ENV"
          printf 'owner=/root/v1_stage_six_lead timeout=20m standard-macos-26 ordinary-uninstrumented-browser-verification original-failure-preserved\n'
      - name: Frozen private dependency and browser preparation
        working-directory: candidate
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --store-dir "$QUAL_ROOT/store"
          pnpm exec playwright install chromium
          node <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const hash = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const core = 'node_modules/.pnpm/playwright-core@1.63.0-alpha-2026-08-05/node_modules/playwright-core/lib/';
          if (hash('pnpm-lock.yaml') !== '04ec614394a2815e3a85ebc0bb9441192c8dee368b97fe1161fc6a95c9b91474' || hash(core+'coreBundle.js') !== 'adf9246486a03bee08b2895db057ba470c62377911d291693fe783d91d6fec52' || hash(core+'utilsBundle.js') !== '580f571bf063e2256b51b3946a035bc452fc0e22808d5547b198baea39923a32') throw new Error('Pinned verification dependency mismatch');
          fs.writeFileSync(process.env.QUAL_ROOT+'/dependency-before.json', JSON.stringify([hash('pnpm-lock.yaml'),hash(core+'coreBundle.js'),hash(core+'utilsBundle.js')]));
          NODE
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Ordinary uninstrumented two-case browser integration
        working-directory: candidate
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NODE_OPTIONS:-}"
          test -z "${Q_BROWSER_CANDIDATE:-}"
          test ! -e "$GITHUB_WORKSPACE/infrastructure/.github/scripts/issue104-browser-host-observer.mjs"
          test ! -e "$GITHUB_WORKSPACE/infrastructure/.github/scripts/issue104-browser-server-observer.cjs"
          pnpm test:integration
      - name: Prove guarded dependencies unchanged after verification
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const hash=(p)=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const core='node_modules/.pnpm/playwright-core@1.63.0-alpha-2026-08-05/node_modules/playwright-core/lib/';
          const after=[hash('pnpm-lock.yaml'),hash(core+'coreBundle.js'),hash(core+'utilsBundle.js')];
          if(JSON.stringify(after)!==fs.readFileSync(process.env.QUAL_ROOT+'/dependency-before.json','utf8')) throw new Error('Guarded dependencies changed');
          console.log('guarded-lock-and-bundles-unchanged=true');
          NODE
      - name: Prove source unchanged after verification, including failure
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'source-head-tree-status-unchanged=true\n'
      - name: Dispose owned private preparation
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${QUAL_ROOT:-}"; then
            case "$QUAL_ROOT" in /private/tmp/bd-*) /bin/rm -rf -- "$QUAL_ROOT" ;; *) exit 1 ;; esac
            test ! -e "$QUAL_ROOT"
            printf 'owned-private-root-removed=%s\n' "$QUAL_ROOT"
          fi
          printf 'No private browser or dependency artifact uploaded; GitHub owns ephemeral runner disposal.\n'
