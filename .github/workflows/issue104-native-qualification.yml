name: Issue 104 native offline qualification
on:
  push:
    branches: [qualification/issue104-stage6-native]
permissions:
  contents: read
concurrency:
  group: issue104-stage6-native
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: 1767045cb3169363e75fd58507012793ae914ac5
      CANDIDATE_TREE: 609309a4ad69f92bf410b7e5e7019e895181fb2b
    steps:
      - uses: actions/checkout@v7
        with:
          path: infrastructure
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1767045cb3169363e75fd58507012793ae914ac5
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: candidate/.node-version
      - name: Select and prove supported tools on the owned disposable host
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/xcode-select --switch /Library/Developer/CommandLineTools
          printf '/Library/Developer/CommandLineTools/usr/bin\n' >> "$GITHUB_PATH"
          export PATH="/Library/Developer/CommandLineTools/usr/bin:$PATH"
          /usr/bin/sw_vers
          /usr/bin/uname -m
          /usr/sbin/sysctl -n hw.logicalcpu hw.memsize
          /bin/df -k "$RUNNER_TEMP"
          test -x /usr/bin/sandbox-exec
          for git_program in /usr/bin/git /Library/Developer/CommandLineTools/usr/bin/git "$(command -v git)"; do
            exec_path=$(env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 "$git_program" --exec-path)
            canonical=$(node -e 'console.log(require("fs").realpathSync(process.argv[1]))' "$exec_path")
            printf 'qualified-git=%s exec-path=%s\n' "$git_program" "$canonical"
            test "$canonical" = /Library/Developer/CommandLineTools/usr/libexec/git-core
          done
          test "$(node --version)" = v24.21.0
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          test "$(pnpm --version)" = 10.34.5
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git -C candidate switch --create ci-native-validation
          git config --global user.name 'Tachiko ephemeral qualification'
          git config --global user.email 'qualification@example.invalid'
          qual_root=$(mktemp -d /private/tmp/tq-XXXXXX)
          chmod 700 "$qual_root"
          mkdir -m 700 "$qual_root/artifact" "$qual_root/browsers" "$qual_root/host-home"
          printf 'QUAL_ROOT=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$qual_root" "$qual_root" >> "$GITHUB_ENV"
          printf 'owner=/root/v1_stage_six_lead cleanup=ephemeral-host-and-owned-private-root timeout=45m\n'
      - name: Frozen host dependency and browser preparation
        working-directory: candidate
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --store-dir "$QUAL_ROOT/artifact/store"
          pnpm exec playwright install chromium
          pnpm_program=$(pnpm exec node -p 'require("fs").realpathSync(process.env.npm_execpath)')
          test -f "$pnpm_program"
          printf 'PNPM_PROGRAM=%s\n' "$pnpm_program" >> "$GITHUB_ENV"
          node -e 'const f=require("fs"),c=require("crypto"),p=require("path");const lock=c.createHash("sha256").update(f.readFileSync("pnpm-lock.yaml")).digest("hex");f.writeFileSync(p.join(process.env.QUAL_ROOT,"artifact/pnpm-lock.yaml.sha256"),lock+"\n",{mode:0o600});f.writeFileSync(p.join(process.env.QUAL_ROOT,"artifact/candidate.json"),JSON.stringify({head:process.env.CANDIDATE_SHA,tree:process.env.CANDIDATE_TREE,lockSha256:lock})+"\n",{mode:0o600});console.log(JSON.stringify({head:process.env.CANDIDATE_SHA,tree:process.env.CANDIDATE_TREE,lockSha256:lock,pnpm:process.env.npm_execpath}))'
          chmod -R go-w "$QUAL_ROOT/artifact" "$QUAL_ROOT/browsers"
      - name: Full host unit and real Darwin confinement tests
        working-directory: candidate
        timeout-minutes: 15
        run: pnpm test
      - name: Browser integration tests
        working-directory: candidate
        timeout-minutes: 5
        run: pnpm test:integration
      - name: Typecheck
        working-directory: candidate
        timeout-minutes: 3
        run: pnpm typecheck
      - name: Root build
        working-directory: candidate
        timeout-minutes: 3
        run: pnpm build
      - name: Control Tower build
        working-directory: candidate
        timeout-minutes: 3
        run: pnpm --dir apps/control-tower build
      - name: Actual offline production adapter in both workspace modes
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          node_program=$(node -p 'require("fs").realpathSync(process.execPath)')
          env -i PATH="$PATH" HOME="$QUAL_ROOT/host-home" TMPDIR=/private/tmp Q_ROOT="$QUAL_ROOT" Q_CANDIDATE="$GITHUB_WORKSPACE/candidate" Q_NODE="$node_program" Q_PNPM="$PNPM_PROGRAM" Q_GIT=/Library/Developer/CommandLineTools/usr/bin/git Q_EXPECTED_SHA="$CANDIDATE_SHA" Q_EXPECTED_TREE="$CANDIDATE_TREE" "$node_program" infrastructure/.github/scripts/issue104-native-qualification.mjs
      - name: Dispose owned private preparation data
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${QUAL_ROOT:-}"; then
            case "$QUAL_ROOT" in /private/tmp/tq-*) /bin/rm -rf -- "$QUAL_ROOT" ;; *) exit 1 ;; esac
            test ! -e "$QUAL_ROOT"
            printf 'owned-private-root-removed=%s\n' "$QUAL_ROOT"
          fi
          printf 'No private dependency/browser/workspace artifact uploaded. GitHub owns ephemeral runner disposal.\n'
