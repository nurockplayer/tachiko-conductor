name: Issue 104 focused native probe diagnosis
on:
  push:
    branches: [qualification/issue104-stage6-native]
permissions:
  contents: read
concurrency:
  group: issue104-stage6-native
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: cea583cad5df4a21f289613ac4ec3ed354171ee7
      CANDIDATE_TREE: cbd1cbc6feb22a49a49edf6dd057de9ce1c16861
    steps:
      - uses: actions/checkout@v7
        with:
          path: infrastructure
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: cea583cad5df4a21f289613ac4ec3ed354171ee7
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: candidate/.node-version
      - name: Select and prove supported tools on the owned disposable host
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/xcode-select --switch /Library/Developer/CommandLineTools
          printf '/Library/Developer/CommandLineTools/usr/bin\n' >> "$GITHUB_PATH"
          export PATH="/Library/Developer/CommandLineTools/usr/bin:$PATH"
          /usr/bin/sw_vers
          /usr/bin/uname -m
          /usr/sbin/sysctl -n hw.logicalcpu hw.memsize
          /bin/df -k "$RUNNER_TEMP"
          test -x /usr/bin/sandbox-exec
          for git_program in /usr/bin/git /Library/Developer/CommandLineTools/usr/bin/git "$(command -v git)"; do
            exec_path=$(env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 "$git_program" --exec-path)
            canonical=$(node -e 'console.log(require("fs").realpathSync(process.argv[1]))' "$exec_path")
            printf 'qualified-git=%s exec-path=%s\n' "$git_program" "$canonical"
            test "$canonical" = /Library/Developer/CommandLineTools/usr/libexec/git-core
          done
          test "$(node --version)" = v24.21.0
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          test "$(pnpm --version)" = 10.34.5
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git -C candidate switch --create ci-native-validation
          git config --global user.name 'Tachiko ephemeral qualification'
          git config --global user.email 'qualification@example.invalid'
          qual_root=$(mktemp -d /private/tmp/tq-XXXXXX)
          chmod 700 "$qual_root"
          mkdir -m 700 "$qual_root/artifact" "$qual_root/browsers" "$qual_root/host-home"
          printf 'QUAL_ROOT=%s\nPLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$qual_root" "$qual_root" >> "$GITHUB_ENV"
          printf 'owner=/root/v1_stage_six_lead cleanup=ephemeral-host-and-owned-private-root timeout=20m\n'
      - name: Frozen host dependency and pinned executable preparation
        working-directory: candidate
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --store-dir "$QUAL_ROOT/artifact/store"
          mkdir -m 700 "$QUAL_ROOT/toolchain"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync(path.join(process.env.QUAL_ROOT, 'toolchain/package.json'), JSON.stringify({
            private: true, packageManager: 'pnpm@10.34.5',
            scripts: { 'locate-pnpm': 'node -p "require(\'fs\').realpathSync(process.env.npm_execpath)"' },
          }));
          NODE
          pnpm_program=$(pnpm --silent --dir "$QUAL_ROOT/toolchain" run locate-pnpm)
          test -f "$pnpm_program"
          node_program=$(node -p 'require("fs").realpathSync(process.execPath)')
          test "$(env -i PATH="$(dirname "$node_program"):/usr/bin:/bin" HOME="$QUAL_ROOT/host-home" "$pnpm_program" --version)" = 10.34.5
          printf 'configured-pnpm=%s\n' "$pnpm_program"
          printf 'PNPM_PROGRAM=%s\n' "$pnpm_program" >> "$GITHUB_ENV"
          node -e 'const f=require("fs"),c=require("crypto"),p=require("path");const lock=c.createHash("sha256").update(f.readFileSync("pnpm-lock.yaml")).digest("hex");f.writeFileSync(p.join(process.env.QUAL_ROOT,"artifact/pnpm-lock.yaml.sha256"),lock+"\n",{mode:0o600});f.writeFileSync(p.join(process.env.QUAL_ROOT,"artifact/candidate.json"),JSON.stringify({head:process.env.CANDIDATE_SHA,tree:process.env.CANDIDATE_TREE,lockSha256:lock})+"\n",{mode:0o600});console.log(JSON.stringify({head:process.env.CANDIDATE_SHA,tree:process.env.CANDIDATE_TREE,lockSha256:lock}))'
          chmod -R go-w "$QUAL_ROOT/artifact" "$QUAL_ROOT/browsers"
      - name: Focused unchanged-source probe with bounded stderr observation
        working-directory: candidate
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=normal)"
          export Q_DIAG_PNPM="$PNPM_PROGRAM"
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/infrastructure/.github/scripts/issue104-probe-stderr.mjs"
          export npm_execpath="$PNPM_PROGRAM"
          set +e
          node node_modules/tsx/dist/cli.mjs --test --test-concurrency=2 --test-name-pattern='runs pinned tools with private IPC' tests/local-command-sandbox.test.ts
          diagnostic_status=$?
          set -e
          unset NODE_OPTIONS Q_DIAG_PNPM npm_execpath
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'diagnostic-only=true unchanged-candidate=true original-test-exit=%s no-qualification-credit=true\n' "$diagnostic_status"
          exit "$diagnostic_status"
      - name: Dispose owned private preparation data
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${QUAL_ROOT:-}"; then
            case "$QUAL_ROOT" in /private/tmp/tq-*) /bin/rm -rf -- "$QUAL_ROOT" ;; *) exit 1 ;; esac
            test ! -e "$QUAL_ROOT"
            printf 'owned-private-root-removed=%s\n' "$QUAL_ROOT"
          fi
          printf 'No private dependency/browser/workspace artifact uploaded. GitHub owns ephemeral runner disposal.\n'
