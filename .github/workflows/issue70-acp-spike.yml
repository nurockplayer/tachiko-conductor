name: Issue 70 DeepSeek Harness ACP spike

on:
  push:
    branches:
      - spike/issue-70-deepseek-acp-20260919

permissions:
  contents: read

jobs:
  cancellation-ownership:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ISSUE70_BASE_SHA: 555523234732af4343426e819f7281e74d06a683
      ISSUE70_HARNESS_COMMIT: ddefc45fbc7f8e46dd73185e68295696d1297887
      ISSUE70_HARNESS_TAG: dsh-v0.1.6-alpha.2
    steps:
      - name: Checkout spike branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set spike runtime path
        run: echo "ISSUE70_RUNTIME_DIR=$RUNNER_TEMP/issue70-runtime" >> "$GITHUB_ENV"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Tachiko pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Build Tachiko guard boundary
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install exact published Harness runtime with upstream pnpm
        run: |
          mkdir -p "$ISSUE70_RUNTIME_DIR"
          cat > "$ISSUE70_RUNTIME_DIR/package.json" <<'JSON'
          {
            "private": true,
            "type": "module",
            "packageManager": "pnpm@11.7.0"
          }
          JSON
          cat > "$ISSUE70_RUNTIME_DIR/pnpm-workspace.yaml" <<'YAML'
          onlyBuiltDependencies:
            - '@deepseek-ai/dsh-subprocess-local'
            - node-pty
            - koffi
          YAML
          pnpm dlx pnpm@11.7.0 -C "$ISSUE70_RUNTIME_DIR" add --save-exact \
            --config.strict-dep-builds=false \
            --allow-build=@deepseek-ai/dsh-subprocess-local \
            --allow-build=node-pty \
            --allow-build=koffi \
            @deepseek-ai/dsh@0.1.6-alpha.2 \
            @agentclientprotocol/sdk@1.4.0
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const runtime = process.env.ISSUE70_RUNTIME_DIR;
          const dsh = require(path.join(runtime, 'node_modules/@deepseek-ai/dsh/package.json'));
          if (dsh.version !== '0.1.6-alpha.2') throw new Error('unexpected dsh version: ' + dsh.version);
          const entry = require.resolve('node-pty', { paths: [runtime] });
          const root = path.dirname(path.dirname(entry));
          const helper = path.join(root, 'prebuilds', process.platform + '-' + process.arch, 'spawn-helper');
          const mode = fs.statSync(helper).mode;
          if ((mode & 0o111) === 0) throw new Error('node-pty spawn-helper is not executable');
          console.log(dsh.name + '@' + dsh.version + ' native-boundary=ready');
          NODE

      - name: Run bounded ACP cancellation ownership probe
        id: spike
        shell: bash
        run: |
          set -o pipefail
          node .github/spikes/issue70-acp-spike.mjs 2>&1 | tee "$RUNNER_TEMP/issue70-evidence.log"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue70-acp-evidence
          path: ${{ runner.temp }}/issue70-evidence.log
          if-no-files-found: warn
          retention-days: 7
